[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cliwitness"
version = "0.1.0"
description = "Declarative black-box contracts for command-line interfaces"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "0xacee" }]
keywords = ["cli", "testing", "contract-testing", "black-box-testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
cliwitness = "cliwitness.cli:main"

[project.urls]
Homepage = "https://github.com/0xacee/cliwitness"
Issues = "https://github.com/0xacee/cliwitness/issues"

[tool.setuptools.packages.find]
where = ["src"]
